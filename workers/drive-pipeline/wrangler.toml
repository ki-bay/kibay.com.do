name = "kibay-drive-pipeline"
main = "src/index.ts"
compatibility_date = "2026-05-11"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 3 days at 3:00 PM Dominican Republic time (AST = UTC-4, no DST) → 19:00 UTC.
# Pipeline picks one unprocessed image (or subfolder = multi-image group) from
# Drive each run. processed_drive_files dedupe means the same file is never
# re-used. When the folder runs out of fresh files, the run becomes a no-op.
# Note: cron `*/3` resets at the start of each month, so the gap between the
# last run of one month and the first run of the next can be 1-3 days; that's
# fine — the pipeline self-throttles to one post per run regardless.
crons = ["0 19 */3 * *"]

[vars]
SUPABASE_URL = "https://bsnxwajuqkatrmgoqcnu.supabase.co"
SUPABASE_STORAGE_BUCKET = "blog_media"
SITE_URL = "https://kibay.com.do"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
WORKER_BASE_URL = "https://kibay-drive-pipeline.sweet-math-09d2.workers.dev"
REVIEW_EMAIL_FROM = "Kibay <info@kibay.com.do>"
REVIEW_EMAIL_TO = "info@kibay.com.do"
META_ENABLED = "true"
META_IG_ENABLED = "true"
LINKEDIN_ENABLED = "true"
# When "true", the pipeline skips the human-approval email and publishes
# straight to the blog + fan-out to social. A results email still goes out
# at the end of the cross-post. Flip to "false" to re-enable the manual
# /approve gate (the code path still exists).
AUTO_PUBLISH = "true"

# Secrets — set with:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON < service-account.json
#   wrangler secret put GOOGLE_DRIVE_FOLDER_ID
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put EMAIL_LINK_SECRET        # 32+ bytes random; signs approve/reject + unsubscribe links
#   wrangler secret put BREVO_WEBHOOK_SECRET     # 32+ bytes random; verifies inbound /webhooks/brevo
