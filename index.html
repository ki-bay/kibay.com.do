<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="generator" content="Kibay" />

		<meta name="theme-color" content="#FF7500" />
		<title>Kibay – Espumante & Caribbean Wine Shop</title>
    <meta name="description" content="Kibay offers modern Caribbean wines and Kibay Espumante, crafted in the Dominican Republic from organic fruits." />

    <!-- Preconnect to font CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- LCP: preload the homepage hero image. Cloudinary serves WebP/AVIF
         via f_auto and auto-compresses via q_auto. imagesrcset matches the
         <picture> sources in HomePage.jsx so the browser fetches the right
         variant before the React app even runs. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      imagesrcset="https://res.cloudinary.com/dwewurxla/image/upload/f_auto,q_auto,w_1200/v1779053427/kibay_-vino_copy_q9mvz8.webp 1200w, https://res.cloudinary.com/dwewurxla/image/upload/f_auto,q_auto,w_2400/v1779053427/kibay_-vino_copy_q9mvz8.webp 2400w"
      imagesizes="100vw"
      href="https://res.cloudinary.com/dwewurxla/image/upload/f_auto,q_auto,w_1200/v1779053427/kibay_-vino_copy_q9mvz8.webp"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kibay.com.do/" />
    <meta property="og:title" content="Kibay – Espumante & Caribbean Wine Shop" />
    <meta property="og:description" content="Kibay offers modern Caribbean wines and Kibay Espumante, crafted in the Dominican Republic from organic fruits." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:image:alt" content="Kibay — Caribbean sparkling wine from the Dominican Republic" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_DO" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kibay.com.do/" />
    <meta property="twitter:title" content="Kibay – Espumante & Caribbean Wine Shop" />
    <meta property="twitter:description" content="Kibay offers modern Caribbean wines and Kibay Espumante, crafted in the Dominican Republic from organic fruits." />
    <meta property="twitter:image" content="/og-default.jpg" />
	</head>
